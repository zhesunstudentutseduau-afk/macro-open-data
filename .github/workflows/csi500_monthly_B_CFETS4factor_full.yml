      - name: Fetch official CFETS 2015-2026 and compare 66 common months
        shell: bash
        run: |
          mkdir -p research/monthly_B_cfets_4factor
          python cfets_B_research/run_4factor_B.py --mode official --out research/monthly_B_cfets_4factor || echo official_fetch_failed > research/monthly_B_cfets_4factor/FAILED.flag
      - name: Save data audit and research results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/monthly_B_cfets_4factor
          git diff --cached --quiet || (git commit -m 'Audit official CFETS and run 4-factor B model' && git push)
      - name: Validate completeness of official 66-month experiment
        shell: bash
        run: |
          if [ -e research/monthly_B_cfets_4factor/FAILED.flag ]; then
            echo 'CFETS full data not verified. Inspect official_download_log.json and MISSING_OFFICIAL_CFETS.txt in research/monthly_B_cfets_4factor.'
            exit 1
          fi
          test -f research/monthly_B_cfets_4factor/REPORT.md
          test -f research/monthly_B_cfets_4factor/baseline_reproduction.txt
          echo 'Complete comparable 66-month three-factor and four-factor backtest succeeded.'
