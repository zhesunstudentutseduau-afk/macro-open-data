                 total=int(cross.weekly_any.sum());cons=float(cross.loc[cross.weekly_any,'same_direction_majority'].mean())
                 text.append(f'2021-03至2026-08共{len(cross)}个月，其中{total}个月周度区间有锚点；**月频满仓信号与该月周频多数周持仓一致率：{cons:.2%}**。')
